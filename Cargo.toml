[workspace]
resolver = "2"
members = [
    "oxiz",
    "oxiz-time",
    "oxiz-core",
    "oxiz-math",
    "oxiz-sat",
    "oxiz-nlsat",
    "oxiz-theories",
    "oxiz-solver",
    "oxiz-opt",
    "oxiz-spacer",
    "oxiz-proof",
    "oxiz-wasm",
    "oxiz-cli",
    "oxiz-smtcomp",
    "oxiz-py",
    "oxiz-ml",
    "bench/regression",
    "bench/profile",
]

# Exclude oxiz-py from default build since it requires maturin for proper Python linking.
# To build oxiz-py: cd oxiz-py && maturin build
default-members = [
    "oxiz",
    "oxiz-time",
    "oxiz-core",
    "oxiz-math",
    "oxiz-sat",
    "oxiz-nlsat",
    "oxiz-theories",
    "oxiz-solver",
    "oxiz-opt",
    "oxiz-spacer",
    "oxiz-proof",
    "oxiz-wasm",
    "oxiz-cli",
    "oxiz-smtcomp",
    "oxiz-ml",
    "bench/regression",
    "bench/profile",
]

[workspace.package]
version = "0.3.3"
edition = "2024"
# Edition 2024 itself only requires rustc 1.85, but the workspace makes
# pervasive use of let-chains (`if ... && let Some(x) = ... { }`, ~350
# occurrences across 156 files as of this release) in production code (e.g.
# `oxiz-sat/src/solver/conflict.rs`, `oxiz-theories/src/euf/solver.rs`), which
# were only stabilized in 1.88. Set as a conservative, evidence-based floor;
# lower it only after removing/rewriting every let-chain use, and raise it if
# a future feature demands a newer compiler.
rust-version = "1.88"
authors = ["COOLJAPAN OU (Team KitaSan)"]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/oxiz"
homepage = "https://github.com/cool-japan/oxiz"
description = "Next-Generation SMT Solver in Pure Rust"
keywords = ["smt", "solver", "sat", "verification", "logic"]
categories = ["algorithms", "science", "mathematics"]

[workspace.lints.rust]
unused_variables = "allow"
dead_code = "allow"

[workspace.lints.clippy]
unwrap_used = "deny"
too_many_arguments = "allow"
type_complexity = "allow"
collapsible_if = "allow"

[workspace.dependencies]
# Meta crate
oxiz = { version = "0.3.3", path = "oxiz" }

# Wasm-safe `std::time` drop-ins. Bottom of the workspace DAG (no deps of its
# own) and depended on by every crate that reads a clock: `std::time::Instant`
# aborts on wasm32-unknown-unknown, and OxiZ reads it on the main check-sat
# path. See oxiz-time/src/lib.rs.
#
# `default-features = false` here matches the other core crates, so a consumer
# that writes `{ workspace = true }` inherits *no* std. Every crate in this
# workspace therefore states its own intent explicitly -- either
# `features = ["std"]` on its dependency line, or `"oxiz-time/std"` in its own
# `std` feature list. Getting that wrong is caught at compile time by the
# `const _: () = assert!(!oxiz_time::IS_FROZEN)` guard each consumer carries.
oxiz-time = { version = "0.3.3", path = "oxiz-time", default-features = false }

# Core crates (default-features = false so downstream can control std)
oxiz-core = { version = "0.3.3", path = "oxiz-core", default-features = false }
oxiz-math = { version = "0.3.3", path = "oxiz-math", default-features = false }
oxiz-sat = { version = "0.3.3", path = "oxiz-sat", default-features = false }
oxiz-nlsat = { version = "0.3.3", path = "oxiz-nlsat" }
oxiz-theories = { version = "0.3.3", path = "oxiz-theories", default-features = false }
oxiz-solver = { version = "0.3.3", path = "oxiz-solver", default-features = false }
oxiz-opt = { version = "0.3.3", path = "oxiz-opt" }
oxiz-spacer = { version = "0.3.3", path = "oxiz-spacer" }
oxiz-proof = { version = "0.3.3", path = "oxiz-proof" }
oxiz-smtcomp = { version = "0.3.3", path = "oxiz-smtcomp" }
oxiz-ml = { version = "0.3.3", path = "oxiz-ml" }

# Memory & Interning
bumpalo = "3.20"
indexmap = { version = "2.14", default-features = false }
lasso = "0.7"

# Parsing
winnow = "1.0"
rhai = "1.25"

# SIMD
wide = "1.5"

# Synchronization
parking_lot = "0.12"

# E-graph / Rewriting
egg = "0.11"

# Parallelism
rayon = "1.12"
num_cpus = "1.17"

# Logging & Tracing
tracing = { version = "0.1", default-features = false }
tracing-subscriber = "0.3"

# Error handling
thiserror = { version = "2.0", default-features = false }
anyhow = "1.0"

# CLI
clap = { version = "4.6", features = ["derive", "cargo"] }
clap_complete = "4.6"
rustyline = "18.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
owo-colors = { version = "4.3", features = ["supports-colors"] }
indicatif = "0.18"
walkdir = "2.5"
globset = "0.4"
notify = "8.2"
sysinfo = "0.39"
dirs = "6.0"
tower-lsp = "0.20"
tokio = "1.52"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"

# WASM
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = [
  "console",
  "Window",
  "Performance",
  "Response",
  # Web Worker hard-preemption support (see js_api::preemptible_worker)
  "Worker",
  "Blob",
  "BlobPropertyBag",
  "Url",
  "MessageEvent",
  "ErrorEvent",
] }
wasm-bindgen-test = "0.3"

# Compression (OxiARC - Pure Rust)
oxiarc-deflate = "0.4.1"
oxiarc-brotli = "0.4.1"

# PDF (Pure Rust)
pdf-writer = "0.15"

# Testing
proptest = "1.11"
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.27"

# Utilities
smallvec = { version = "1.15", features = ["serde", "union"] }
rustc-hash = { version = "2.1", default-features = false }
hashbrown = "0.17"
lru = "0.18"
num-rational = { version = "0.4", default-features = false }
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
num-integer = { version = "0.1", default-features = false }
libm = "0.2"
portable-atomic = { version = "1.13", default-features = false, features = ["critical-section"] }
portable-atomic-util = { version = "0.2", default-features = false, features = ["alloc"] }
rand = "0.10"

# Text processing & date/time
regex = "1.12"
chrono = "0.4"

# Python bindings
# NOTE: never add "extension-module" here -- see oxiz-py/Cargo.toml
pyo3 = { version = "0.29", features = ["num-bigint"] }

# Deliberately size-tuned (opt-level = "z") for wasm builds. This is NOT the
# profile to use for benchmarks, timing claims, or SMT-COMP builds -- use
# `release-speed` below for those.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# Speed-tuned profile for benchmarks, timing claims, and SMT-COMP builds; the
# default release profile above stays size-tuned for wasm.
[profile.release-speed]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16

[profile.bench]
inherits = "release-speed"
debug = true

[profile.dev]
opt-level = 1
