[package]
name = "oxiz-spacer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Property Directed Reachability (PDR/IC3) engine for OxiZ - Horn clause solving"
readme = "README.md"
keywords = ["smt", "pdr", "ic3", "horn", "verification"]
categories = ["algorithms", "development-tools::testing"]

[dependencies]
oxiz-core = { workspace = true, features = ["std"] }
# `"nlsat"` is named explicitly, not inherited. The workspace dependency table
# sets `default-features = false`, so this line's feature list is the whole
# feature set this crate gets; before `nlsat` was split out of `oxiz-theories`'s
# `std`, "std" alone carried the nonlinear (QF_NRA/QF_NIA) solver in. Naming it
# keeps this crate deciding exactly the logics it decided before.
oxiz-solver = { workspace = true, features = ["std", "nlsat"] }
oxiz-time = { workspace = true, features = ["std"] }
smallvec.workspace = true
rustc-hash = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
indexmap = { workspace = true, features = ["std"] }
num-bigint = { workspace = true, features = ["std"] }
num-rational = { workspace = true, features = ["std"] }

[dev-dependencies]
proptest.workspace = true

[lints.clippy]
unwrap_used = "deny"
