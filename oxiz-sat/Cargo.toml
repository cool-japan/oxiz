[package]
name = "oxiz-sat"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "High-performance CDCL SAT Solver for OxiZ"
readme = "README.md"
keywords = ["sat", "cdcl", "solver"]
categories = ["algorithms"]

[features]
default = ["std"]
std = ["rayon", "tracing", "rustc-hash/std", "oxiz-core/std", "oxiz-time/std"]
profiling = ["std", "oxiz-core/profiling"]
# Enable verbose debug output in conflict analysis
analyze-debug = []

[dependencies]
oxiz-core = { workspace = true, default-features = false }
oxiz-time = { workspace = true }
tracing = { workspace = true, default-features = false, optional = true }
smallvec = { workspace = true }
rustc-hash = { workspace = true }
rayon = { workspace = true, optional = true }
hashbrown.workspace = true
portable-atomic-util = { workspace = true }
libm.workspace = true

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
# Pure-Rust LRAT checker used by the end-to-end proof-tracing regression
# tests (tests/pr26_lrat_proof_regressions.rs). `oxiz-proof`'s own optional
# dependency back on this crate (its `sat-integration` feature) is not
# enabled here, so this is not a real dependency cycle — Cargo resolves
# dev-dependency edges like this independently of the normal graph.
# Path-only (not `{ workspace = true }`): a dev-dep with a `version` survives
# packaging and forces `cargo publish -p oxiz-sat` to resolve oxiz-proof from
# crates.io — which fails, since oxiz-proof publishes in a later tier than
# oxiz-sat. Path-only dev-deps are stripped from the published manifest.
oxiz-proof = { path = "../oxiz-proof" }

# Profile-Guided Optimization (PGO) Configuration
#
# To use PGO for maximum performance:
#
# 1. Build with instrumentation:
#    RUSTFLAGS="-Cprofile-generate=/tmp/pgo-data" cargo build --release
#
# 2. Run representative workload to generate profile data:
#    ./target/release/oxiz-sat <your-benchmark-files>
#
# 3. Merge profile data:
#    llvm-profdata merge -o /tmp/pgo-data/merged.profdata /tmp/pgo-data
#
# 4. Build with PGO:
#    RUSTFLAGS="-Cprofile-use=/tmp/pgo-data/merged.profdata -Cllvm-args=-pgo-warn-missing-function" cargo build --release
#
# For SIMD optimizations, use:
#    RUSTFLAGS="-C target-cpu=native" cargo build --release

[lints.clippy]
unwrap_used = "deny"
