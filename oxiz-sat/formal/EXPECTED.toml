# Machine-readable mirror of the "Measured L1 verdict" doc comment on every
# `#[harness]` and `#[proof_for_contract]` entry point in this package, in
# exactly the format `cargo-formal`'s own `examples/checked-arith/EXPECTED.toml`
# uses.
#
# **MEASURED, not predicted** (2026-09-08/09, release `cargo-formal` 0.1.0 CLI
# + release `formal-driver` with dependency-body and monomorphic-instance
# lowering, OxiZ 0.3.3, rustc `nightly-2026-06-20`). The harnesses call the
# public API of `oxiz-sat` by path (`..`);
# `[package.metadata.formal] dep-crates` names that one crate, and the run
# lowered 19 dependency bodies (all 19 reachable) and 0 monomorphic instances
# into the verification conditions. No verdict below was written before the run
# that produced it.
#
# Two versions of one file. The harnesses verify
# `oxiz-sat/src/literal.rs` **of this working tree**, which carries the Phase 2b
# fix (`Var::MAX_INDEX`, the `debug_assert!`s, the checked `to_dimacs`,
# `try_to_dimacs`). The solver that decides them is crates.io OxiZ `=0.3.3`,
# whose own embedded SAT core still carries the *unfixed* copy of that same
# file. `README.md` states what that does and does not license.
#
# Naming. A property key is the word the **encoder actually mints**, never a
# description:
#
#   * a user-written `oxiformal::assert(..)` is `assert`; a second distinct
#     assertion raised at the *same* source site is `assert-2`, a third
#     `assert-3`, and so on.
#   * an `#[ensures]` clause checked through `#[proof_for_contract]` is
#     `ensures`, and is reported under layer `contract`. The nine
#     `spec_*_contract` harnesses of `src/spec.rs` raise them. All the clauses
#     of one wrapper expand at that wrapper's own `fn` span, so N of them are
#     keyed `ensures`, `ensures-2`, ... in declaration order by the
#     property-table collision rule -- and the number of keys is the number of
#     obligations the encoder actually raised, which is not always the number
#     of clauses written (`spec_lit_from_code`'s three clauses raise one).
#   * everything else is the design section 9 closed vocabulary MIR's own
#     inserted checks produce: `arith-overflow`, `shift-overflow`,
#     `bounds-check`, `division-by-zero`, `remainder-by-zero`,
#     `division-overflow`, `neg-overflow`, `unwrap`, `expect`, `panic`,
#     `slice-range`, `unwinding-assertion`. A bare `debug_assert!` with no
#     format arguments lowers to `core::panicking::panic`, so its key is
#     `panic`, not `assert` -- which is why every refutation below is a
#     `panic` row.
#   * the pseudo-key `harness` is a **whole-harness** verdict and nothing else:
#     `"proved"` means "no obligation of this harness is anything but proved"
#     (including a harness that raises none at all), and `"unsupported"` covers
#     both `Verdict::Unsupported` and `Verdict::Unverifiable`. This package
#     needs it nowhere: every harness encodes.
#
# What is listed. Every obligation the harness is *about* -- its `assert`s,
# its `ensures` keys,
# plus every `panic` row (six harnesses have one, eight obligations in all:
# six `debug_assert!` expansions and two reaches of `to_dimacs`'s unconditional
# panic, and both refutations are among them) -- and every incidental
# MIR-inserted check whose verdict is **not** `proved`. In the 2026-09-15
# measurement there are none of the latter either: every undecided row is an
# `assert`, an `ensures*` or a `panic` row that a harness is about, and every
# incidental `arith-overflow`, `shift-overflow` and `neg-overflow` obligation
# is proved.
# The `neg-overflow` rows of the three DIMACS harnesses are listed although
# they are incidental and proved, because the pre-fix twin vendored into
# cargo-formal as `examples/ecosystem/oxiz-sat-lit` measures the one on
# `dimacs_negation_harness` as `refuted`; that contrast is the point of this
# package. Other incidental checks that came out `proved` (`arith-overflow`,
# `shift-overflow`) are
# deliberately not enumerated: they are numerous, they carry no information,
# and listing them would make this file a copy of `report.json` rather than a
# statement of intent.
#
# Keying rule. `[harness.expected]` is a map, so several obligations of one
# harness that carry the same property name at *different* source sites share
# one row. The row records the **worst** of their verdicts (`refuted` >
# `timeout` > `unknown` > `unsupported`/`unverifiable` > `proved`), and a row
# comment says how many sites there are and how the others came out. Two rows
# in this file use that rule and disagree across their sites, and both say so:
# `dimacs_negation_harness`'s `panic` (2 sites, 1 refuted / 1 proved) and
# `lbool_negate_involution_harness`'s `assert` (8 sites, 5 proved / 3 unknown).
#
# Measured tally (2026-09-09, the original `#[harness]`-only measurement):
# 18 property rows over 9 harnesses --
# 15 proved / 2 refuted / 1 unknown. The run's own layer counters, which
# include the incidental `proved` rows this file does not enumerate, are:
# bmc 65 proved / 2 refuted / 3 unknown / 0 timeout / 0 unsupported /
# 0 unverifiable over 70 obligations, every one of them backed by a
# `vc/NNNN.smt2` reproduction, and contract 0 proved / 0 refuted. Hygiene
# passes with 0 errors, 0 warnings and 0 notes over 2 files and 0 `unsafe`
# sites. The audit layer's `unverifiable` histogram is **empty**: nothing in
# the 19 lowered dependency bodies is refused for a reason at all.
#
# Re-measured 2026-09-14 with rebuilt release binaries on the same pins
# (`cargo-formal` 0.1.0, OxiZ 0.3.3, rustc `nightly-2026-06-20`): every row
# below reproduced exactly -- the same 18 rows (15 proved / 2 refuted /
# 1 unknown), the same two counterexamples, and the same layer counters.
#
# Measured tally (2026-09-15, cargo-formal Phase 3 wave D2, release CLI and
# release driver built from cargo-formal `0621fc0` with 0 uncommitted files;
# options `autoharness off, modular on, vacuity check on`; `--jobs 4`,
# `--evidence lrat`, fresh `--target-dir`; OxiZ 0.3.3, rustc
# `nightly-2026-06-20`): the nine `spec_*_contract` harnesses below add
# **37 property rows -- 27 proved / 2 refuted / 8 unknown**, and the 18 rows
# above re-measured with exactly one change (next paragraph), so this file now
# lists **55 rows over 18 harnesses -- 42 proved / 3 refuted / 10 unknown**. The run's own
# layer counters are bmc 100 proved / 3 refuted / 5 unknown and contract
# 15 proved / 0 refuted / 7 unknown over 130 obligations, all 130 backed by a
# `vc/NNNN.smt2` reproduction. Hygiene passes over 3 files. Evidence:
# `reproduction` 130, `lrat` 15 (checker `oxiz-proof 0.3.3` -- **discounted**,
# see below), and after `cargo formal replay --all --solver z3` an
# `external-replay` on 83 items, which takes `coverage.claim` from 0 of 115
# proved satisfied to 81 of 115. `cargo formal replay --all --check-lrat`
# re-verified all 15 certificates and both recorded SHA-256s of each. `check`
# exits 1, both `replay --all` invocations exit 0. Two runs from separate
# fresh target dirs produced byte-identical verdict tables.
#
# The self-host discount is why the z3 replay matters. `claim-requires`
# defaults to `lrat, oxilean-verify, external-replay` for a `self-host`
# package, and the run prints `self-host discount: 15 proved item(s) carry
# evidence from this prover's own release train, which corroborates nothing
# here`: the LRAT certificates are produced by crates.io `oxiz-sat` 0.3.3 and
# checked by `oxiz-proof` 0.3.3, the published copy of the crate under test.
# The only independent evidence here is z3 4.15.4, run as a subprocess on the
# same scripts by `replay --all --solver z3`: 115 agree, 3 agree (weak -- the
# three refuted rows replayed `sat`), 12 resolved. **No `proved` row was
# answered `sat`**; `target/formal/conformance/` was not created; there is no
# soundness incident in this run.
#
# ONE ROW MOVED, and it is not a rewrite for convenience.
# `dimacs_negation_harness`'s `panic` row was `refuted` on 2026-09-08/09 and
# on 2026-09-14 and is `unknown` (`solver-model-rejected`) in this run, over
# the same source, the same pins and the same seed. It reproduced in every
# Phase 3 run (four of them, two before `src/spec.rs` existed), and the lost
# witness is explained rather than lost: z3 4.15.4 decides the very same
# script `sat` (`replay --solver z3`), and
# `harness::plain_tests::from_dimacs_rejects_the_reported_dimacs_counterexample`
# runs `i32::MIN` concretely and panics. The property is still refutable at
# exactly the recorded witness; what changed is that OxiZ 0.3.3 now returns a
# model cargo-formal's mandatory model check refuses, which is the check doing
# its job. The contract twin `spec_lit_from_dimacs_nonzero_contract` records
# the refutation with the same counterexample in the same run.
#
# `solver-model-rejected` count: **12 in the recorded Phase 3 wave-D2 run** (it
# was 3 when only the nine `#[harness]` entry points existed). **Do not diff
# this number: the counter is not stable across runs.** On cargo-formal's own
# `examples/checked-arith`, **the same binaries on the same source with the
# same `seed = 1` reported 12 (wave D1's run) and 4 (the close-out verifier's)**
# — a factor of three apart on two runs whose verdicts are item-for-item
# identical — and `../oxilean/crates/oxilean-kernel/formal` reported 28 and 27
# in two runs against the 25 its own header records. Two independent runs of *this*
