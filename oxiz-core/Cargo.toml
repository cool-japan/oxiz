[package]
name = "oxiz-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core AST, Sorts, and Traits for OxiZ SMT Solver"
readme = "README.md"
keywords = ["smt", "ast", "logic"]
categories = ["algorithms", "data-structures"]

[dependencies]
# Always available (no_std compatible)
indexmap = { workspace = true, default-features = false }
thiserror = { workspace = true, default-features = false }
tracing = { workspace = true, default-features = false, optional = true }
smallvec = { workspace = true }
rustc-hash = { workspace = true }
num-rational = { workspace = true, default-features = false, features = ["num-bigint"] }
num-bigint = { workspace = true, default-features = false }
num-traits = { workspace = true, default-features = false }
num-integer = { workspace = true, default-features = false }
hashbrown.workspace = true
portable-atomic = { workspace = true }
portable-atomic-util = { workspace = true }
oxiz-math = { workspace = true, default-features = false }
oxiz-time = { workspace = true }

# Optional (std-only)
# All of these are defined under [workspace.dependencies] (root Cargo.toml)
# and inherited here per the workspace-inheritance policy.
lasso = { workspace = true, optional = true, features = ["multi-threaded"] }
bumpalo = { workspace = true, features = ["collections"], optional = true }
winnow = { workspace = true, optional = true }
# Behind the `scripting` feature (see [features]); named with `dep:` there, so
# this line does not also create an implicit `rhai` feature. An implicit one
# would be a trap rather than a courtesy: `features = ["rhai"]` would pull the
# crate -- and the MPL-2.0 `smartstring` it depends on -- into the licence
# graph while `ScriptableTactic` stayed compiled out, which is the exact
# combination this feature exists to make impossible.
rhai = { workspace = true, features = ["sync"], optional = true }
wide = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }

[features]
# `scripting` is on by default, so a consumer that says nothing keeps exactly
# the API surface it had before this feature existed. It is separated out of
# `std` rather than folded into it because the two answer different questions:
# `std` is "does this target have an allocator and an OS", `scripting` is "does
# this build let users write tactics in Rhai". A consumer that only encodes
# goals and calls `check-sat` -- the QF_LIA case this was cut for -- wants the
# first without the second, and writes
# `default-features = false, features = ["std"]`.
default = ["std", "scripting", "property-tests"]
std = [
    "lasso",
    "bumpalo",
    "winnow",
    "wide",
    "rayon",
    "parking_lot",
    "tracing",
    "tracing/std",
    "thiserror/std",
    "indexmap/std",
    "num-rational/std",
    "num-bigint/std",
    "num-traits/std",
    "num-integer/std",
    "rustc-hash/std",
    "oxiz-math/std",
    "oxiz-time/std",
]
# User-defined tactics written in Rhai, i.e. `tactic::ScriptableTactic` and
# nothing else -- it is the only item in the crate that touches the engine.
# Implies `std`: the whole `tactic` module is std-only.
#
# Turning it OFF removes that one type; every other tactic, probe and
# combinator is untouched, and no solving path degrades, because nothing in the
# workspace constructs a `ScriptableTactic` (a script string has to come from
# the consumer). What it buys is a smaller dependency graph and, for anyone who
# vets licences, a **permissive-only** one: `rhai` reaches `smartstring`, which
# is MPL-2.0, and that is the only copyleft crate OxiZ has ever pulled in. A
# downstream whose `cargo deny check licenses` allows Apache/MIT/BSD/ISC/Zlib
# only writes `default-features = false, features = ["std"]` and passes.
scripting = ["dep:rhai", "std"]
arena = ["bumpalo"]
profiling = ["std"]
# On by default: measured 89 tests in 0.08s, 2026-08-25 (mirrors oxiz-solver).
property-tests = []

[dev-dependencies]
proptest = { workspace = true }

[lints.clippy]
unwrap_used = "deny"
