# COOLJAPAN Pure-Rust policy: banned C/C++/Fortran-backed or duplicate-purpose crates.
# See ~/.claude/CLAUDE.md "Dependency Replacements" table.

[graph]
targets = []

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[licenses.private]
# bench/regression and bench/profile are internal dev-tooling (publish = false);
# don't fail the license check just because they aren't published to crates.io.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "openblas-src" },
    { crate = "openblas-sys" },
    { crate = "bincode" },
    { crate = "rustfft" },
    { crate = "z3" },
    { crate = "z3-sys" },
    { crate = "rusqlite" },
    { crate = "libsqlite3-sys" },
    { crate = "zip" },
    { crate = "flate2" },
    { crate = "zstd" },
    { crate = "zstd-sys" },
    { crate = "bzip2" },
    { crate = "bzip2-sys" },
    { crate = "lz4" },
    { crate = "lz4-sys" },
    { crate = "tar" },
    { crate = "snap" },
    { crate = "brotli" },
    { crate = "miniz_oxide" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
