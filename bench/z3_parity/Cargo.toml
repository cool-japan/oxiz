[package]
name = "oxiz-z3-parity"
version = "0.3.3"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]
# This is a standalone crate, not part of the main workspace

[dependencies]
oxiz = { path = "../../oxiz" }
oxiz-solver = { path = "../../oxiz-solver" }
oxiz-core = { path = "../../oxiz-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
# Local-time timestamp with a UTC offset for the results metadata header.
# Pure Rust; `clock` (not the wasm/legacy default features) is all that is used.
chrono = { version = "0.4.45", default-features = false, features = [
    "clock",
    "std",
] }
rayon = "1.10"
colored = "2.1"
tabled = "0.17"

[dev-dependencies]
tempfile = "3.0"
