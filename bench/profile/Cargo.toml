[package]
name = "bench-profile"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Profiling benchmarks for the OxiZ SMT solver"
publish = false

[dependencies]
num-rational = { workspace = true, default-features = false, features = ["num-bigint"] }
oxiz-core = { workspace = true, default-features = false, features = ["profiling"] }
oxiz-proof = { workspace = true, features = ["profiling"] }
oxiz-sat = { workspace = true, default-features = false, features = ["profiling"] }
# `"nlsat"` is named explicitly, not inherited. The workspace dependency table
# sets `default-features = false`, so this line's feature list is the whole
# feature set this crate gets; before `nlsat` was split out of `oxiz-theories`'s
# `std`, "std" alone carried the nonlinear (QF_NRA/QF_NIA) solver in. Naming it
# keeps this crate deciding exactly the logics it decided before.
oxiz-solver = { workspace = true, default-features = false, features = ["profiling", "nlsat"] }
oxiz-theories = { workspace = true, default-features = false, features = ["profiling", "nlsat"] }
rustc-hash = { workspace = true }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "profile_benchmarks"
harness = false

[lints.clippy]
unwrap_used = "deny"
