# nextest configuration for the oxiz workspace.
#
# `oxiz-cli` ships a handful of tests that spawn the real `oxiz` binary as a
# subprocess and race it against a wall-clock deadline (the `--timeout`
# regression tests in `tests/audit_cli_p2.rs` and
# `tests/audit_sweep_frontends.rs`) or measure its wall-clock duration
# (`tests/benchmark.rs`'s `bench_*` tests). Under nextest's default
# concurrency, many of these can run at once, each spawning its own
# CPU-bound child solver; the resulting CPU oversubscription was observed to
# turn a 2s `--timeout` into tens to hundreds of seconds of real wall time,
# which starves the very timing margins these tests rely on and makes them
# flaky. `supervise_timeout` (oxiz-cli/src/main.rs) already mitigates the
# *supervisor* side of this (a dedicated, non-solving watchdog process), but
# it cannot help once the machine itself is oversubscribed by many parallel
# test processes each spawning their own solver child.
#
# Force this subset into a single-threaded serial group so at most one such
# subprocess-racing/timing test runs at a time, regardless of the overall
# `--test-threads` nextest is running with.
[test-groups]
oxiz-cli-subprocess = { max-threads = 1 }

# A runaway allocation previously ran until the kernel OOM killer intervened;
# nextest's default reports a test as SLOW at 60s but never terminates it.
# Cap it so a stuck test is killed instead of consuming memory indefinitely.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# Tighter budget for CI: fail fast on a stuck test instead of burning the job's wall clock.
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'package(oxiz-cli) and (test(timeout) or test(bench))'
test-group = 'oxiz-cli-subprocess'
threads-required = 1

# `bv_wide_soundness::wide_sub_of_add_two_vars_is_identity_above_64_bits`
# bit-blasts `(not (= (bvsub (bvadd x y) y) x))` at 65, 96 and 128 bits — three
# full two-variable wide-BV searches in one test body. It is a *soundness*
# guard (0.3.3 and the 0.3.4 base answer a false `sat` at every one of those
# widths), so it may not be weakened, shortened or split into fewer widths to
# fit a clock.
#
# Its own module documents the calibration as a release-build figure. Under the
# unoptimised profile `cargo nextest` builds by default it takes 151.5 s run
# inside the workspace suite on this machine, which is *under* the 180 s the
# default `period = 60s, terminate-after = 3` allows and *over* it once the
# machine is loaded: one workspace run at `--test-threads 4` killed it at 180 s
# and the next let it pass at 151.5 s. That is a gate whose colour depends on
# what else is running, which is the same machine-dependence decision (9)
# removed from the solver itself.
#
# 600 s (four times the loaded measurement) is the budget. It is a *kill*
# ceiling, not an expected duration: the test still reports SLOW at 60 s, so a
# real hang is still visible in the output rather than silently tolerated.
[[profile.default.overrides]]
filter = 'package(oxiz-solver) and test(wide_sub_of_add_two_vars_is_identity_above_64_bits)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'package(oxiz-solver) and test(wide_sub_of_add_two_vars_is_identity_above_64_bits)'
slow-timeout = { period = "60s", terminate-after = 10 }

# `array_uf_combination::array_uf_campaign` is this round's long differential
# campaign: thousands of generated array/UF scripts, each parsed, solved and
# scored against the in-test oracle, in one test body. It is `#[ignore]`d, so
# it runs only under `--run-ignored all`, and it is a *coverage* guard rather
# than a timing one — shortening it to fit a clock would be exactly the
# weakening decision (16) forbids.
#
# Measured on this machine: 225.1 s in a release build outside nextest, and
# over the default `period = 60s, terminate-after = 3` (180 s) inside it, which
# is how a green `--run-ignored all` run turns into `TIMEOUT [180.007s]` with
# nothing wrong. Same treatment, and the same reasoning, as the
# `wide_sub_of_add_two_vars_is_identity_above_64_bits` override above: a kill
# ceiling well clear of the measurement, with SLOW still reported at 60 s so a
# real hang stays visible.
[[profile.default.overrides]]
filter = 'package(oxiz-solver) and test(array_uf_campaign)'
slow-timeout = { period = "60s", terminate-after = 15 }

[[profile.ci.overrides]]
filter = 'package(oxiz-solver) and test(array_uf_campaign)'
slow-timeout = { period = "60s", terminate-after = 15 }

# `array_ext_shapes_campaign` is the 6,000-script sibling. It fitted inside the
# default 180 s while its generator rendered every script with
# `(set-option :timeout 1000)`; `#P2b-46` took that clock out (it decided the
# gate's `bad_model` tally, not only its duration — see
# `array_uf_combination.rs`), and the campaign now needs the same headroom its
# sibling does.
[[profile.default.overrides]]
filter = 'package(oxiz-solver) and test(array_ext_shapes_campaign)'
slow-timeout = { period = "60s", terminate-after = 15 }

[[profile.ci.overrides]]
filter = 'package(oxiz-solver) and test(array_ext_shapes_campaign)'
slow-timeout = { period = "60s", terminate-after = 15 }

# `round4_recheck_regressions::array_cardinality_above_the_enumeration_limit_is_decided`
# is `#P2b-46`'s correctness guard for the Skolem cascade above
# `ARRAY_INDEX_ENUMERATION_LIMIT`: eleven pairwise-distinct arrays over
# `(Array (_ BitVec 4) (_ BitVec 1))`, which answered `unknown` before the fix
# and `sat` after it. It carries a verdict, not a timing claim, so decision (16)
# keeps it in the gate rather than behind `#[ignore]` — but it costs 0.91 s in
# release and 113.9 s in the profile `cargo nextest` builds, which is over the
# shared 180 s ceiling once the machine is loaded.
#
# Same treatment as the two overrides above: a kill ceiling well clear of the
# measurement, with SLOW still reported at 60 s.
[[profile.default.overrides]]
filter = 'package(oxiz-solver) and test(array_cardinality_above_the_enumeration_limit_is_decided)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'package(oxiz-solver) and test(array_cardinality_above_the_enumeration_limit_is_decided)'
slow-timeout = { period = "60s", terminate-after = 10 }

# The two `#[ignore]`d cost pins of `#P2b-46` assert that the shapes which used
# to produce *no answer at all* now come back on the deterministic
# embedded-check budget. That budget is 250,000 checks, which is minutes by
# construction — 346.6 s and 124.6 s in a release build — so they need a
# ceiling of their own for `--run-ignored all` not to report a spurious
# TIMEOUT. They are opt-in and carry no gate.
[[profile.default.overrides]]
filter = 'package(oxiz-solver) and (test(the_index_width_three_cardinality_ladder_terminates) or test(the_store_term_cliff_terminates) or test(the_cardinality_cliff_table) or test(the_whole_array_cardinality_ladder_is_decided))'
slow-timeout = { period = "60s", terminate-after = 40 }

[[profile.ci.overrides]]
filter = 'package(oxiz-solver) and (test(the_index_width_three_cardinality_ladder_terminates) or test(the_store_term_cliff_terminates) or test(the_cardinality_cliff_table) or test(the_whole_array_cardinality_ladder_is_decided))'
slow-timeout = { period = "60s", terminate-after = 40 }
