[package]
name = "oxiz-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI for OxiZ SMT Solver (SMT-LIB2 compliant)"
readme = "README.md"
keywords = ["smt", "cli", "smtlib"]
categories = ["command-line-utilities"]

[[bin]]
name = "oxiz"
path = "src/main.rs"
doc = false

[dependencies]
oxiz-core = { workspace = true, features = ["std"] }
# `"nlsat"` is named explicitly, not inherited. The workspace dependency table
# sets `default-features = false`, so this line's feature list is the whole
# feature set this crate gets; before `nlsat` was split out of `oxiz-theories`'s
# `std`, "std" alone carried the nonlinear (QF_NRA/QF_NIA) solver in. Naming it
# keeps this crate deciding exactly the logics it decided before.
oxiz-solver = { workspace = true, features = ["std", "nlsat"] }
oxiz-proof = { workspace = true }
oxiz-smtcomp = { workspace = true }
oxiz-ml = { workspace = true }
num-rational = { workspace = true, default-features = false, features = ["std"] }
clap = { workspace = true }
clap_complete = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
rustyline = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
owo-colors = { workspace = true }
indicatif = { workspace = true }
walkdir = { workspace = true }
globset = { workspace = true }
notify = { workspace = true }
sysinfo = { workspace = true }
rayon = { workspace = true }
dirs = { workspace = true }
tower-lsp = { workspace = true }
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
chrono.workspace = true
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
rustc-hash = { workspace = true, features = ["std"] }

[lints.clippy]
unwrap_used = "deny"
