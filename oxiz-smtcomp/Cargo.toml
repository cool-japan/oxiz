[package]
name = "oxiz-smtcomp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SMT-COMP benchmark infrastructure for OxiZ"
readme = "README.md"
keywords = ["smt", "benchmark", "smtcomp", "testing"]
categories = ["development-tools::testing"]

[lints]
workspace = true

[features]
default = []
pdf-report = ["dep:pdf-writer"]
ws-progress = ["dep:tokio", "dep:axum", "dep:tower-http"]

[dependencies]
oxiz-core = { workspace = true, features = ["std"] }
# `"nlsat"` is named explicitly, not inherited. The workspace dependency table
# sets `default-features = false`, so this line's feature list is the whole
# feature set this crate gets; before `nlsat` was split out of `oxiz-theories`'s
# `std`, "std" alone carried the nonlinear (QF_NRA/QF_NIA) solver in. Naming it
# keeps this crate deciding exactly the logics it decided before.
oxiz-solver = { workspace = true, features = ["std", "nlsat"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
walkdir = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
rayon = { workspace = true }
rand = { workspace = true }
lru = { workspace = true }
pdf-writer = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "net", "sync"] }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = { workspace = true }
futures-util.workspace = true
